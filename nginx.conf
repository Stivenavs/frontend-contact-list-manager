user  nginx;
worker_processes  auto;

# Sección de eventos obligatoria
events {
    worker_connections 4096;  # Número máximo de conexiones que cada proceso de trabajo puede manejar
    multi_accept on;
}

# Este es el bloque http donde puedes definir tus servidores
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Compresión GZIP para reducir tamaño de respuestas
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Configuración de límites
    client_max_body_size 10M;
    keepalive_timeout  65;
    
    # Timeouts optimizados
    send_timeout 30s;
    client_body_timeout 30s;
   
    # Configuración del servidor
    server {
        listen 9398;
        server_name localhost;

        # Seguridad
        server_tokens off;

        # Cache control para archivos estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Proxy a API (mismo pod - network namespace compartido)
        location /api/ {
            proxy_pass http://127.0.0.1:3000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Buffering y timeouts
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Ruta raíz
        location / {
            root /etc/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
            
            # Cache para index.html sin caché persistente
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        # Ruta 50x
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            access_log off;
        }
    }
}
