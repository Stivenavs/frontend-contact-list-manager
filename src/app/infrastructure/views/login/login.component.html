<!-- Login Page -->
<div class="login-container">
  <!-- Login Content -->
  <div class="login-content">
    <!-- Form Column -->
    <div>
      <!-- title -->
      <h2>Login Lista de contactos</h2>

      <!-- Form -->
      <form (ngSubmit)="onSubmit($event)">
        <!-- Form Email -->
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"  
            [(ngModel)]="email"
            name="email"
            placeholder="correo@ejemplo.com"
            required
          />
        </div>

        <!-- Form Password -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Contraseña"
            required
          />
        </div>

        <!-- Form Submit -->
        <div class="form-group">
          <button type="submit" class="login-button">Ingresar</button>
        </div>

        <!-- Form Recordarme -->
        <div class="recordarme">
          <label> <input type="checkbox" id="rememberMe" [(ngModel)]="rememberMe" name="rememberMe" /> Recordarme </label>
        </div>

        <!-- errores -->
        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>
      </form>
    </div>
  </div>
</div>
