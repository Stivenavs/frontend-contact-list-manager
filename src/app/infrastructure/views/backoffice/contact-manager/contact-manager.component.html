<p-toast />
<p-confirmDialog />

<div class="backoffice-page-header">
  <h2>Gestión de contactos</h2>
  <p-button label="Nuevo Contacto" icon="pi pi-user-plus" (onClick)="openNew()" />
</div>

<div class="backoffice-card">
  <p-table
    #dt
    [value]="items"
    [loading]="loading"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [globalFilterFields]="['firstName', 'lastName', 'email', 'phone']"
    dataKey="id"
    styleClass="p-datatable-gridlines">

    <ng-template #caption>
      <div class="table-caption">
        <span class="table-title">Contactos registrados ({{ items.length }})</span>
        <p-iconfield>
          <p-inputicon styleClass="pi pi-search" />
          <input
            pInputText
            type="text"
            placeholder="Buscar…"
            (input)="dt.filterGlobal($any($event.target).value, 'contains')" />
        </p-iconfield>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="firstName">Nombre <p-sortIcon field="firstName" /></th>
        <th pSortableColumn="email">Correo <p-sortIcon field="email" /></th>
        <th pSortableColumn="phone">Teléfono <p-sortIcon field="phone" /></th>
        <th style="width:120px">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-row>
      <tr>
        <td><strong>{{ row.firstName }} {{ row.lastName }}</strong></td>
        <td>{{ row.email }}</td>
        <td>{{ row.phone }}</td>
        <td>
          <div class="action-btns">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" (onClick)="edit(row)" pTooltip="Editar" />
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="confirmDelete(row)" pTooltip="Eliminar" />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr><td colspan="4" class="empty-table">No hay contactos registrados.</td></tr>
    </ng-template>
  </p-table>
</div>

<!-- Dialog Crear / Editar -->
<p-dialog
  [(visible)]="visible"
  [header]="isEditing ? 'Editar Contacto' : 'Nuevo Contacto'"
  [modal]="true"
  [style]="{ width: '600px' }"
  [draggable]="false">

  <div class="form-grid">

    <div class="form-field">
      <label>Nombre *</label>
      <input type="text" pInputText [(ngModel)]="item.firstName" placeholder="Nombre" maxlength="150" />
    </div>

    <div class="form-field">
      <label>Apellido *</label>
      <input type="text" pInputText [(ngModel)]="item.lastName" placeholder="Apellido" maxlength="150" />
    </div>

    <div class="form-field">
      <label>Correo electrónico *</label>
      <input type="email" pInputText [(ngModel)]="item.email" placeholder="correo@ejemplo.com" maxlength="150" />
    </div>

    <div class="form-field">
      <label>Teléfono</label>
      <input type="text" pInputText [(ngModel)]="item.phone" placeholder="3001234567" maxlength="30" />
    </div>

  </div>

  <ng-template #footer>
    <p-button label="Cancelar" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="visible = false" />
    <p-button [label]="isEditing ? 'Actualizar' : 'Crear'" icon="pi pi-check" (onClick)="save()" />
  </ng-template>
</p-dialog>
